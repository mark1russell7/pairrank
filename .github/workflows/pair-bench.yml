# The pair bench (R31 of docs/ROADMAP.md): the duels of packages/host/src/bench/pairs.
#
#   changes        The action changes of the template. The other jobs run only on a pull request that changes the
#                  ratings or the bench, and on each run by hand.
#   duel           One job for each job of SWEEP_JOBS in gate.ts. Each duel has a seeded hidden taste, and it counts
#                  the answers until the ladder agrees with the taste. The results go to the artifact pair-<job>.
#   verdict        The report of each rule and size, the dense probes, the work of a full search and the gate. The
#                  report goes to the summary of the run. The job fails when a gated case is beyond, or has no read.
#   pair-bench-ok  The summary check "Pair bench OK".
#
# A count of picks has no noise of time, so the same commit gives the same counts on each runner.
# A run by hand: gh workflow run pair-bench.yml --ref <branch>
name: Pair bench

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push cancels the run of a pull request. A run by hand on main ends with a result (main-runs-finish).
concurrency:
  group: pair-bench-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          paths: |
            packages/core/src/**
            packages/ratings/src/**
            packages/ratings/package.json
            packages/host/src/bench/pairs/**
            packages/host/package.json
            pnpm-lock.yaml
            .github/workflows/pair-bench.yml

  duel:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        # The names of the jobs of SWEEP_JOBS. A test of duel.test.ts holds this list.
        job:
          - 20-sites
          - 50-sites
          - 300-sites
          - 300-sites-dense-fit
          - 8-sites-full-search
          - 16-sites-full-search
          - 32-sites-full-search
          - 64-sites-full-search
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Play the duels of the job
        run: node packages/host/src/bench/pairs/run.ts --job "$JOB" --out pair-records
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pair-${{ matrix.job }}
          path: pair-records/${{ matrix.job }}.json
          if-no-files-found: error
          retention-days: 90

  verdict:
    needs: [changes, duel]
    if: ${{ !cancelled() && needs.changes.outputs.match == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A gated case with no result is "no read", and the verdict fails.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pair-*
          path: pair-records
          merge-multiple: true
      - name: The verdict of the pair bench
        run: |
          mkdir -p pair-records
          node packages/host/src/bench/pairs/verdict.ts --records pair-records

  pair-bench-ok:
    name: Pair bench OK
    if: ${{ !cancelled() }}
    needs: [changes, duel, verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@214dbed7b52dac94c0dce1c170162e75672a556d # main
        with:
          needs: ${{ toJSON(needs) }}
